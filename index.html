<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Saurav Kumar — ML Engineer · Generative AI</title>
    <meta name="description" content="Saurav Kumar is an ML Engineer specializing in Generative AI — RAG pipelines, AI agents, recommendation systems, and production ML APIs on Azure." />
    <meta name="author" content="Saurav Kumar" />
    <link rel="canonical" href="https://saurav-portfolio.in/" />
    <meta name="theme-color" content="#faf8f4" />

    <!-- Google Search Console: replace CONTENT with the code from
         https://search.google.com/search-console -> Settings -> Ownership verification -> HTML tag -->
    <!-- <meta name="google-site-verification" content="REPLACE_ME" /> -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saurav Kumar — Portfolio" />
    <meta property="og:title" content="Saurav Kumar — ML Engineer · Generative AI" />
    <meta property="og:description" content="ML Engineer specializing in Generative AI — RAG pipelines, AI agents, recommendation systems, and production ML APIs." />
    <meta property="og:url" content="https://saurav-portfolio.in/" />
    <meta property="og:image" content="https://saurav-portfolio.in/profile.jpg" />
    <meta property="og:image:alt" content="Saurav Kumar" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Saurav Kumar — ML Engineer · Generative AI" />
    <meta name="twitter:description" content="ML Engineer specializing in Generative AI — RAG pipelines, AI agents, recommendation systems, and production ML APIs." />
    <meta name="twitter:image" content="https://saurav-portfolio.in/profile.jpg" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Saurav Kumar",
      "jobTitle": "Machine Learning Engineer",
      "url": "https://saurav-portfolio.in/",
      "image": "https://saurav-portfolio.in/profile.jpg",
      "worksFor": { "@type": "Organization", "name": "Kitab" },
      "alumniOf": [
        { "@type": "CollegeOrUniversity", "name": "Indian Institute of Technology, Madras" },
        { "@type": "CollegeOrUniversity", "name": "University of Delhi" }
      ],
      "knowsAbout": ["Generative AI", "Retrieval-Augmented Generation", "LLM Fine-tuning", "AI Agents", "Recommendation Systems", "Azure", "Python"],
      "sameAs": [
        "https://github.com/SK-15",
        "https://www.linkedin.com/in/sauravkumar1503/"
      ]
    }
    </script>

    <script>
      // Mirror deploys (gh-pages, vercel previews) must not compete with the
      // canonical domain in search results.
      (function () {
        var h = location.hostname;
        if (h !== 'saurav-portfolio.in' && h !== 'www.saurav-portfolio.in' && h !== 'localhost' && h !== '127.0.0.1') {
          var m = document.createElement('meta');
          m.name = 'robots';
          m.content = 'noindex';
          document.head.appendChild(m);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      // Apply saved theme before paint to avoid flash of wrong theme
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
